server:
  port: ${PORT:8080}
spring:
  application:
    name: loyalty-api
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
logging:
  structured:
    format:
      console: co.edu.corhuila.barbersaas.loyalty.observability.LogContractFormatter
loyalty:
  version: 2.0.0
  environment: ${ENVIRONMENT:dev}
  appointment-api-url: ${APPOINTMENT_API_URL:http://appointment-api:8080}
